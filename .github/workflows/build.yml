name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: mingc/android-build-box:latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Debug APK
        run: |
          export ANDROID_HOME=/opt/android-sdk
          export PATH=$PATH:$ANDROID_HOME/platform-tools:$ANDROID_HOME/cmdline-tools/latest/bin
          
          # Проверяем наличие gradlew, если его нет - используем глобальный gradle из контейнера
          if [ -f "./gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            # В этом контейнере gradle может лежать в /opt/gradle/... или вызываться через android build tools
            # Попробуем найти gradle или использовать ant/mvn/gradle если доступно
            # Если в контейнере gradle доступен по другому пути:
            /opt/gradle/gradle-*/bin/gradle assembleDebug --no-daemon --stacktrace || gradle assembleDebug --no-daemon --stacktrace
          fi

      - name: Prepare Output
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/AssetExplorer.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AssetExplorer-apk
          path: out/AssetExplorer.apk

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: build-${{ github.run_number }}
          name: Asset Explorer build ${{ github.run_number }}
          files: out/AssetExplorer.apk
