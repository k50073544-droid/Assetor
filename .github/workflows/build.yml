name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare Project Files
        run: |
          shopt -s nullglob
          
          # 1. Если в репозитории есть ZIP-архив, распаковываем его
          zips=(*.zip)
          if [ ${#zips[@]} -gt 0 ]; then
            for z in "${zips[@]}"; do
              echo "Extracting $z..."
              unzip -o -q "$z" -d .
            done
          fi

          # 2. Если settings.gradle лежит во вложенной папке, переносим в корень
          if [ ! -f "settings.gradle" ]; then
            SETTING_FILE=$(find . -mindepth 2 -maxdepth 3 -name "settings.gradle" | head -n 1)
            if [ -n "$SETTING_FILE" ]; then
              DIR=$(dirname "$SETTING_FILE")
              echo "Found settings.gradle in $DIR, moving files to root..."
              cp -rn "$DIR"/* . 2>/dev/null || cp -r "$DIR"/* .
            fi
          fi

          echo "Root directory contents:"
          ls -la

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/AssetExplorer.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AssetExplorer-apk
          path: out/AssetExplorer.apk

      - name: Publish release (direct APK download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Asset Explorer build ${{ github.run_number }}
          files: out/AssetExplorer.apk
