name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Debug APK with local Gradlew
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare Output
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/AssetExplorer.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AssetExplorer-apk
          path: out/AssetExplorer.apk
