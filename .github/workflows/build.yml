name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # 🚀 ШАГ 1: Распаковываем архив
      - name: Unzip Project
        run: |
          unzip AssetExplorer.zip -d ./project_temp

      # 🚀 ШАГ 2: Ищем, где именно лежат файлы сборки внутри архива
      - name: Find Project Root
        id: find_root
        run: |
          # Ищем файл settings.gradle, чтобы понять, где корень проекта
          BUILD_FILE=$(find ./project_temp -name "settings.gradle" -o -name "settings.gradle.kts" | head -n 1)
          
          if [ -z "$BUILD_FILE" ]; then
            echo "Ошибка: В архиве нет файлов сборки Gradle!"
            exit 1
          fi
          
          # Получаем путь к папке с проектом
          PROJECT_DIR=$(dirname "$BUILD_FILE")
          echo "Найден проект в папке: $PROJECT_DIR"
          echo "dir=$PROJECT_DIR" >> $GITHUB_OUTPUT

      # 🚀 ШАГ 3: Генерируем gradlew и собираем
      - name: Generate Wrapper and Build
        run: |
          cd ${{ steps.find_root.outputs.dir }}
          gradle wrapper --gradle-version 8.7
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      # 🚀 ШАГ 4: Забираем готовый APK
      - name: Prepare Output
        run: |
          mkdir -p out
          # Ищем собранный APK в папке проекта
          find ./project_temp -name "*.apk" -exec cp {} out/AssetExplorer.apk \;

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AssetExplorer-apk
          path: out/AssetExplorer.apk

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: build-${{ github.run_number }}
          name: Asset Explorer build ${{ github.run_number }}
          files: out/AssetExplorer.apk
